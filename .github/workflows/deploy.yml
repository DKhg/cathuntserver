# ───────────────────────────────────────────────────────────────────────
# 서버 자동 배포 (CI/CD) — main 에 push 하면: 이미지 빌드 → EC2 서버로 전송 → 재시작
# deploy.ps1 이 손으로 하던 일을 GitHub 가 대신한다.
#
# ★ 쓰기 전에 Codemagic 아님, GitHub 저장소 설정에서 "Secrets" 2개 등록:
#   Settings > Secrets and variables > Actions > New repository secret
#     - SERVER_IP        : terraform 출력의 server_ip (예: 3.35.x.x)
#     - SSH_PRIVATE_KEY  : infra/terraform/cathunt-key.pem 파일 "내용 전체" 복붙
#
# ⚠️ 서버가 먼저 떠 있어야 함(terraform apply + 첫 deploy.ps1 1회). 그 뒤부터 자동.
#    Secrets 없거나 서버 없으면 이 워크플로는 실패(빨간 X)만 뜨고 아무 피해 없음.
# ───────────────────────────────────────────────────────────────────────
name: Deploy server

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'          # 문서만 바뀌면 배포 안 함
      - 'infra/**'       # 인프라(terraform)는 로컬에서 apply (여기선 앱만 배포)
  workflow_dispatch: {}  # GitHub 화면에서 수동 실행 버튼도 제공

jobs:
  deploy:
    runs-on: ubuntu-latest   # GitHub 제공 리눅스(amd64) = EC2(t3.small x86_64)와 아키텍처 일치
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: 앱 이미지 빌드
        run: docker build -t cathunt:latest .

      - name: 이미지를 파일로 저장(압축)
        run: docker save cathunt:latest | gzip > cathunt-image.tar.gz

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 서버로 이미지 전송
        run: scp -i ~/.ssh/key.pem cathunt-image.tar.gz ec2-user@${{ secrets.SERVER_IP }}:/tmp/

      - name: 서버에서 적재 + 재시작
        run: |
          ssh -i ~/.ssh/key.pem ec2-user@${{ secrets.SERVER_IP }} '
            gunzip -f /tmp/cathunt-image.tar.gz &&
            sudo docker load -i /tmp/cathunt-image.tar &&
            rm -f /tmp/cathunt-image.tar &&
            cd /opt/cathunt && sudo docker compose up -d &&
            sudo docker compose ps
          '
