# ───────────────────────────────────────────────────────────────────────
# 서버 자동 배포 (CI/CD) — main 에 push 하면:
#   GitHub가 이미지 빌드 → ghcr.io(무료 레지스트리)에 push → AWS 서버가 pull 해서 실행
# (네 PC·Docker Desktop 안 씀. 전부 GitHub 클라우드에서.)
#
# ★ GitHub 저장소 Settings > Secrets and variables > Actions 에 2개 등록:
#     - SERVER_IP        : terraform output 의 server_ip
#     - SSH_PRIVATE_KEY  : infra/terraform/cathunt-key.pem 파일 "내용 전체"
#   (ghcr push는 자동 GITHUB_TOKEN 사용 → 별도 키 불필요)
#
# ★ 최초 1회: 첫 실행으로 ghcr 패키지가 생기면 → GitHub > Packages > cathunt
#   > Package settings > Change visibility > Public 으로 바꾼다
#   (그래야 서버가 로그인 없이 pull 가능. 비공개로 두려면 서버에 ghcr 토큰 로그인 필요)
#
# ⚠️ 서버가 먼저 떠 있어야(terraform apply) 서버 pull 단계가 성공한다.
# ───────────────────────────────────────────────────────────────────────
name: Deploy server

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'infra/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # ghcr.io push 권한
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름 (ghcr는 소문자만)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/cathunt" >> "$GITHUB_ENV"

      - name: ghcr 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 + ghcr에 push
        run: |
          docker build -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 서버에서 pull + 재시작
        run: |
          ssh -i ~/.ssh/key.pem ec2-user@${{ secrets.SERVER_IP }} '
            cd /opt/cathunt &&
            sudo docker compose pull app &&
            sudo docker compose up -d &&
            sudo docker compose ps
          '
