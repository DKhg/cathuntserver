# 운영(prod) 전용 설정. 비밀값은 여기 두지 않는다 — 전부 환경변수(DB_PASSWORD, JWT_SECRET)로 준다.
# 실행: SPRING_PROFILES_ACTIVE=prod, DB_PASSWORD=..., JWT_SECRET=...(32바이트+), DB_URL=..., CORS_ALLOWED_ORIGINS=...
spring:
  jpa:
    hibernate:
      ddl-auto: validate        # 운영: 스키마는 Flyway가 관리, JPA는 엔티티↔테이블 일치만 검증
    show-sql: false             # 운영 로그에 SQL·데이터 안 남김
  flyway:
    enabled: true
    baseline-on-migrate: true   # 이미 테이블이 있는 DB도 V1을 베이스라인으로 보고 시작
    baseline-version: 1
